{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="brand-mark">▣</div><h2>Welcome back</h2><p class="text-secondary">Sign in to your library account.</p>
  <form method="post">
    <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required placeholder="you@example.com">
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required placeholder="Your password">
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
  <p class="text-center mt-4 mb-0">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
